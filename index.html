<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header></header>
    <main>
        <div class="title">
            <h1>LOGIN</h1>
        </div>

        <form method="Post">
            <div>
                <input type="text" name="username" id="textbox" required placeholder="Username" maxlength="15" minlength="8">
            </div>

            <div>
                <input type="password" name="password" id="password" required placeholder="Password" maxlength="15" minlength="8">
            </div>

            <div>
                <div>
                    <input type="checkbox" name="rem_me?" id="rem_me?">
                    <label for="rem_me?">Remember me?</label>
                </div>
                <div>
                    <a href="#">Forgot Password?</a>
                </div>
            </div>

            <div>
                <button type="submit">LOGIN</button>
            </div>
            
            <div>
                <p>Don't have an account yet? <a href="#">Register name</a></p>
            </div>

        </form>
    </main>
</body>
</html>
